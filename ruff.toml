# Ruff configuration for the standard analysis pipeline.
# Kept here (instead of on the command line) so `tasks.py` and CI stay in sync.

# The conda env runs Python 3.9: tells ruff (and its auto-fixes) never to introduce newer
# syntax such as `X | None` annotations, which crash at import on 3.9.
target-version = "py39"

[lint]
# Pin the rule set explicitly. Ruff's DEFAULT set grew a lot in 0.15+, so without this the
# same code passes on one machine and fails in CI depending on the installed ruff version.
# E = pycodestyle errors, F = pyflakes: the classic "real bugs" set this project uses.
select = ["E", "F"]
# Project-wide relaxations:
#   F403/F405 - the utils package intentionally re-exports via `from .x import *`.
#   E501      - long lines are fine (scientific formulas, long strings).
#   E722      - bare `except:` is tolerated in the notebooks/helpers.
ignore = ["F403", "F405", "E501", "E722"]

[lint.per-file-ignores]
# Notebooks keep some imports only as commented "escape hatch" examples for users
# (e.g. `# probe = pi.read_prb(...)`), so don't flag unused imports (F401) there.
"*.ipynb" = ["F401"]
